 
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Natura | Iniciar sesión</title>
</head>

<body>

    <header>
        <a href="index.html">Natura</a>
    </header>

    <main>
        <h1>Iniciar sesión</h1>

        <form id="form-login">

            <div>
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>
            <button type="submit">Ingresar</button>
            <p id="mensaje-login"></p>
        </form>
    </main>
    <script type="module" src="./js/login/Login.js"></script>
</body>
</html>
