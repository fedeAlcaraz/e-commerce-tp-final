<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF9F5">

    <title>Natura | Iniciar sesión</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header class="encabezado-login">
        <a href="index.html" class="logo">Natura<span>.</span></a>
        <a href="index.html" class="volver-inicio">Volver a la tienda</a>
    </header>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="encabezado-formulario">
                <span class="etiqueta">BIENVENIDO/A</span>
                <h1>Iniciar sesión</h1>
                <p>Ingresá a tu cuenta para continuar.</p>
            </div>

            <form id="form-login">

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="boton-login">
                    Ingresar
                </button>

                <p id="mensaje-login" class="mensaje-login" aria-live="polite"></p>

            </form>

            <div class="separador"></div>

            <p class="texto-registro">
                ¿Todavía no tenés una cuenta?
                <a href="register.html">Registrate</a>
            </p>
        </section>
        <p class="texto-inferior">
            Natura · Un espacio para descubrir y cuidar de vos.
        </p>
    </main>
    <script type="module" src="./js/login/Login.js"></script>
</body>
</html>
