<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF9F5">
    <title>Mis pedidos | Natura</title>
    <link rel="stylesheet" href="css/pedidos.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor encabezado-contenido">
            <div class="identidad">
                <a href="index.html">Natura<span>.</span></a>
            </div>
            <nav class="navegacion" aria-label="Navegación principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#categorias">Categorías</a></li>
                    <li><a href="index.html#productos">Productos</a></li>
                </ul>
            </nav>
            <div class="acciones-usuario">
                <form class="buscador" action="#" method="GET">
                    <input
                        type="search"
                        id="busqueda"
                        name="buscar"
                        placeholder="¿Qué estás buscando?"
                        aria-label="Buscar productos"
                    >
                    <button type="submit">Buscar</button>
                </form>
                <div class="enlaces-usuario">
                    <a href="login.html">Iniciar sesión</a>
                    <a href="carrito.html">Carrito</a>
                    <a href="MiCuenta.html">Mi cuenta</a>
                </div>
            </div>
        </div>
    </header>
    <main class="contenedor-pedidos">
        <div class="encabezado-pagina">
            <span class="etiqueta">TU ACTIVIDAD</span>
            <h1>Mis pedidos</h1>
            <p>Consultá el historial de tus compras en Natura.</p>
        </div>
        <section id="lista-pedidos" class="seccion-pedidos">

            <div class="encabezado-seccion">
                <div>
                    <h2>Historial de compras</h2>
                    <p>Tus pedidos realizados.</p>
                </div>
            </div>

            <div id="pedidos" class="pedidos-grid">
            </div>

        </section>
    </main>
    <footer class="pie-pagina">
        <div class="contenedor">
            <a href="index.html" class="logo-pie">Natura<span>.</span></a>
            <p>Una forma más natural de cuidarte.</p>
        </div>
    </footer>
    <script type="module" src="./js/pedidos/MostrarPedidos.js"></script>
</body>
</html>
