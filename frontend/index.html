
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Natura | Tienda online</title>
</head>

<body>
    <header>
        <div class="identidad">
            <a href="index.html">Natura</a>
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#categorias">Categorías</a></li>
                <li><a href="#productos">Productos</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#nosotros">Nosotros</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            <form action="#" method="GET">
                <label for="busqueda">Buscar productos</label>
                <input
                    type="search"
                    id="busqueda"
                    name="buscar"
                    placeholder="¿Qué estás buscando?"
                >
                <button type="submit">Buscar</button>
            </form>
            <a href="#">Mi cuenta</a>
            <a href="#">Carrito</a>
        </div>
    </header>
    <main>
        <section id="inicio">
            <h1>Bienvenido a Natura</h1>
            <p>
                Descubrí nuestros productos y encontrá lo que necesitás.
            </p>
            <a href="#productos">Explorar productos</a>
        </section>
        <section id="categorias">
            <h2>Explorá nuestras categorías</h2>
            <div class="lista-categorias">
                <article class="categoria">
                    <h3>Nombre de categoría</h3>
                    <a href="#">Ver productos</a>
                </article>
            </div>
        </section>
        <section id="productos">
            <h2>Nuestros productos</h2>
            <div id="catalogo-productos">
            <!-- JavaScript insertará los productos aquí -->
            </div>
        </section>
    </main>
    <script type="module" src="js/InicioMostrarProductos.js"></script>
</body>
</html>
