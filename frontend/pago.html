<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finalizar compra | Natura</title>
</head>
<body>
    <header>
        <div class="identidad">
            <a href="index.html">Natura</a>
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#categorias">Categorías</a></li>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="index.html#ofertas">Ofertas</a></li>
                <li><a href="index.html#nosotros">Nosotros</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            <a href="login.html">Mi cuenta</a>
            <a href="carrito.html">Mi carrito</a>
        </div>
    </header>
    <main>
        <h1>Finalizar compra</h1>
        <section id="detalle-pedido">
            <h2>Detalle del pedido</h2>
            <div id="productos-pedido">
            </div>
            <p>
                Total:
                <span id="total-pedido">$0</span>
            </p>
        </section>
        <section id="seleccion-pago">
            <h2>Medio de pago</h2>
            <form id="formulario-pago">
                <fieldset>
                    <legend>Seleccioná cómo querés pagar</legend>
                    <div>
                        <input
                            type="radio"
                            id="pago-efectivo"
                            name="medio_pago"
                            value="efectivo"
                            required
                        >
                        <label for="pago-efectivo">Efectivo</label>
                    </div>
                    <div>
                        <input
                            type="radio"
                            id="pago-transferencia"
                            name="medio_pago"
                            value="transferencia"
                        >
                        <label for="pago-transferencia">Transferencia bancaria</label>
                    </div>
                </fieldset>
                <button type="submit">Confirmar pedido</button>
            </form>
            <a href="carrito.html">Volver al carrito</a>
        </section>
    </main>
    <script type="module" src="./js/pago/MostrarPedido.js"></script>
    <script type="module" src="./js/pago/HacerPago.js"></script>
</body>
</html>
