<div class="opcion-pago">
    <input
        type="radio"
        id="pago-efectivo"
        name="medio_pago"
        value="efectivo"
        required
    >
    <label for="pago-efectivo">
        <span class="informacion-pago">
            <span class="nombre-pago">Efectivo</span>
            <span class="descripcion-pago">
                Pago en efectivo al momento de la entrega.
            </span>
        </span>
        <span class="indicador-pago"></span>
    </label>
</div>

<div class="opcion-pago">
    <input
        type="radio"
        id="pago-transferencia"
        name="medio_pago"
        value="transferencia"
    >

    <label for="pago-transferencia">
        <span class="informacion-pago">
            <span class="nombre-pago">Transferencia bancaria</span>
            <span class="descripcion-pago">
                Realizá una transferencia para abonar tu pedido.
            </span>
        </span>
        <span class="indicador-pago"></span>
    </label>
</div>
