<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF9F5">
    <title>Natura | Registro</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <header class="encabezado-login">
        <a href="index.html" class="logo">Natura<span>.</span></a>
        <a href="login.html" class="volver-inicio">Ya tengo una cuenta</a>
    </header>

    <main class="contenedor-registro">

        <section class="tarjeta-registro">

            <div class="encabezado-formulario">
                <span class="etiqueta-formulario">BIENVENIDO A NATURA</span>
                <h1>Crear cuenta</h1>
                <p>Completá tus datos para comenzar.</p>
            </div>

            <form id="form-registro">

                <section class="grupo-formulario">
                    <h2>Datos personales</h2>

                    <div class="campos-grid">

                        <div class="campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre"
                                placeholder="Tu nombre" required>
                        </div>

                        <div class="campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido"
                                placeholder="Tu apellido" required>
                        </div>

                        <div class="campo">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" name="dni"
                                placeholder="Tu número de documento" required>
                        </div>

                        <div class="campo">
                            <label for="fecha_nacimiento">Fecha de nacimiento</label>
                            <input type="date" id="fecha_nacimiento"
                                name="fecha_nacimiento" required>
                        </div>

                        <div class="campo campo-completo">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email"
                                placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="campo campo-completo">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password"
                                placeholder="Creá una contraseña" required>
                        </div>

                    </div>
                </section>

                <section class="grupo-formulario grupo-direccion">
                    <h2>Dirección</h2>
                    <p class="descripcion-grupo">
                        Indicá dónde podemos encontrarte.
                    </p>

                    <div class="campos-grid">

                        <div class="campo campo-completo">
                            <label for="calle">Calle</label>
                            <input type="text" id="calle" name="calle"
                                placeholder="Nombre de la calle" required>
                        </div>

                        <div class="campo">
                            <label for="altura">Altura</label>
                            <input type="text" id="altura" name="altura"
                                placeholder="Número" required>
                        </div>

                        <div class="campo">
                            <label for="cp">Código postal</label>
                            <input type="text" id="cp" name="cp"
                                placeholder="Código postal" required>
                        </div>

                        <div class="campo">
                            <label for="piso">Piso (opcional)</label>
                            <input type="text" id="piso" name="piso"
                                placeholder="Piso">
                        </div>

                        <div class="campo">
                            <label for="dpto">Departamento (opcional)</label>
                            <input type="text" id="dpto" name="dpto"
                                placeholder="Departamento">
                        </div>

                        <div class="campo campo-completo">
                            <label for="idLocalidad">Localidad</label>
                            <select id="idLocalidad" name="idLocalidad" required>
                                <option value="">Seleccioná una localidad</option>
                            </select>
                        </div>
                    </div>
                </section>
                <button type="submit" class="boton-registro">
                    Crear mi cuenta
                </button>
                <p id="mensaje-registro" class="mensaje-registro"
                    aria-live="polite"></p>
            </form>
            <div class="separador"></div>
            <p class="texto-inferior">
                ¿Ya tenés una cuenta?
                <a href="login.html">Iniciá sesión</a>
            </p>
        </section>
    </main>
    <script type="module" src="./js/register/register.js"></script>
</body>
</html>
