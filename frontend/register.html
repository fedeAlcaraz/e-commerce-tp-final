<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Natura | Registro</title>
</head>
<body>
<header>
    <a href="index.html">Natura</a>
</header>
<main>
    <h1>Crear cuenta</h1>
    <form id="form-registro">
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>
        </div>
        <div>
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" required>
        </div>
        <div>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="fecha_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>
        <h2>Dirección</h2>
        <div>
            <label for="calle">Calle</label>
            <input type="text" id="calle" name="calle" required>
        </div>
        <div>
            <label for="altura">Altura</label>
            <input type="text" id="altura" name="altura" required>
        </div>
        <div>
            <label for="piso">Piso (opcional)</label>
            <input type="text" id="piso" name="piso">
        </div>
        <div>
            <label for="dpto">Departamento (opcional)</label>
            <input type="text" id="dpto" name="dpto">
        </div>
        <div>
            <label for="cp">Código postal</label>
            <input type="text" id="cp" name="cp" required>
        </div>
        <div>
            <label for="idLocalidad">Localidad</label>
        <select id="idLocalidad" name="idLocalidad" required>
            <option value="">Seleccioná una localidad</option>
        </select>
        </div>
        <button type="submit">Registrarme</button>
        <p id="mensaje-registro"></p>
    </form>
</main>
    <script type="module" src="./js/register/register.js"></script>
</body>
</html>
